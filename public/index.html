<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>제주대 오늘의 학식 · 천원의 아침밥</title>
  <meta name="description" content="제주대학교 천원의 아침밥과 학생식당(6호관·1호관·백두관·사라캠퍼스) 식단을 한 화면에서 봅니다.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="제주대 오늘의 학식 · 천원의 아침밥">
  <meta property="og:description" content="6호관·1호관·백두관·사라캠퍼스 아침·점심·저녁을 한 화면에서">
  <meta property="og:locale" content="ko_KR">
  <meta name="theme-color" content="#f7f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191612" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="제주대 학식">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <p class="eyebrow">제주대학교 학식 모아보기</p>
        <h1 id="title">오늘의 학식</h1>
      </div>
      <div class="top-side">
        <button class="install" id="install" type="button" hidden>앱 설치</button>
        <p class="now" id="now" aria-live="polite"></p>
      </div>
    </div>
    <nav class="wrap days" id="days" aria-label="날짜 선택"></nav>
    <div class="wrap">
      <div class="tabs" role="tablist" id="tabs" aria-label="끼니 선택"></div>
    </div>
  </header>

  <main class="wrap" id="main">
    <div class="skeleton" aria-hidden="true">
      <div class="card sk"></div><div class="card sk"></div><div class="card sk"></div>
    </div>
  </main>

  <section class="wrap gym" id="gym" aria-labelledby="h-gym"></section>

  <section class="wrap info" aria-labelledby="h-info">
    <h2 id="h-info">식당 정보</h2>
    <div id="info"></div>
  </section>

  <footer class="wrap foot" id="foot"></footer>

  <dialog class="sheet" id="install-guide" aria-labelledby="guide-title">
    <h2 id="guide-title">홈 화면에 추가하기</h2>
    <ol id="guide-steps"></ol>
    <form method="dialog"><button class="sheet-close">확인</button></form>
  </dialog>

  <dialog class="sheet" id="order-sheet" aria-labelledby="order-title">
    <h2 id="order-title">식당 순서 바꾸기</h2>
    <p class="sheet-sub">위에 둔 식당이 먼저 나옵니다. 이 휴대폰에만 저장돼요.</p>
    <ol class="order-list" id="order-list"></ol>
    <div class="sheet-row">
      <button type="button" class="sheet-secondary" id="order-reset">기본 순서로</button>
      <form method="dialog"><button class="sheet-close">완료</button></form>
    </div>
  </dialog>

  <script src="app.js" type="module"></script>
  <!-- Vercel Web Analytics: 대시보드에서 Analytics 를 켜야 집계된다 (쿠키 없음) -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
