name: 식단 수집

on:
  schedule:
    # 한국 시간 매일 06:07, 11:07, 16:07 (UTC 기준으로 적음)
    - cron: '7 21 * * *'
    - cron: '7 2 * * *'
    - cron: '7 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run scrape
      - name: 바뀐 메뉴가 있으면 커밋
        run: |
          # generatedAt 만 바뀐 경우는 커밋하지 않는다 (불필요한 재배포 방지)
          if git diff --quiet -I'"generatedAt"' -- public/data/menus.json; then
            echo "메뉴 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/menus.json
          git commit -m "식단 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
